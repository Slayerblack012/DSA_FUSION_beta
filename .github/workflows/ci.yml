name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check for dependency conflicts
        run: |
          python -m pip check || true

      - name: Ruff lint (if installed)
        run: |
          if python -c "import pkgutil, sys; sys.exit(0 if pkgutil.find_loader('ruff') else 1)"; then
            ruff check app || true
            ruff format --check app tests || true
          else
            echo "ruff not installed, skipping lint checks"
          fi

      - name: Run Pytest
        run: |
          if [ -d "tests" ]; then
            pytest -q tests
          else
            echo "No tests directory found, skipping."
          fi

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Lint frontend (if available)
        run: npm run lint --if-present || true

      - name: Build frontend
        run: npm run build --if-present
